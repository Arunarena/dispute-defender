<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050914" />
    <meta name="robots" content="noindex" />
    <title>Your package · Tap-to-Confirm</title>
    <link rel="icon" href="/img/shield.svg" type="image/svg+xml" />
    <style>
      :root { --bg: #050914; --panel: rgba(14, 22, 44, .82); --ink: #e8f0ff; --muted: #8a9bc4; --cyan: #00e5ff; --green: #2bffb1; --amber: #ffb547; --red: #ff4d6d; --line: rgba(0, 229, 255, .18); }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: radial-gradient(ellipse at 50% -10%, #0d2a4a 0%, var(--bg) 60%); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { max-width: 440px; margin: 0 auto; padding: max(24px, env(safe-area-inset-top)) 20px 40px; text-align: center; }
      .pulse { position: relative; width: 150px; height: 150px; margin: 18px auto 10px; display: grid; place-items: center; }
      .pulse i { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--cyan); opacity: 0; animation: ring 2.4s ease-out infinite; }
      .pulse i:nth-child(2) { animation-delay: .8s; } .pulse i:nth-child(3) { animation-delay: 1.6s; }
      .pulse b { font-size: 54px; filter: drop-shadow(0 0 18px rgba(0, 229, 255, .7)); }
      .ok .pulse i { border-color: var(--green); } .warn .pulse i { border-color: var(--amber); }
      @keyframes ring { from { transform: scale(.35); opacity: .9; } to { transform: scale(1.1); opacity: 0; } }
      .kicker { font: 700 11px/1 ui-monospace, "JetBrains Mono", monospace; letter-spacing: .2em; color: var(--cyan); }
      h1 { font-size: 26px; margin: 10px 0 6px; }
      p { color: var(--muted); margin: 6px 0; }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin: 18px 0; text-align: left; backdrop-filter: blur(10px); }
      .card .row { display: flex; gap: 10px; align-items: center; }
      .card .row + .row { margin-top: 8px; }
      .tick { color: var(--green); font-weight: 800; }
      button, .btn { display: block; width: 100%; padding: 16px; margin: 10px 0; border-radius: 14px; border: 1px solid var(--line); background: rgba(255, 255, 255, .04); color: var(--ink); font: 700 16px system-ui, sans-serif; cursor: pointer; }
      button.go { border: 0; color: #00151a; background: linear-gradient(90deg, var(--cyan), var(--green)); box-shadow: 0 0 26px rgba(0, 229, 255, .35); }
      button.bad { border-color: rgba(255, 181, 71, .5); color: var(--amber); }
      button:disabled { opacity: .5; }
      textarea { width: 100%; min-height: 110px; border-radius: 12px; border: 1px solid var(--line); background: rgba(0, 0, 0, .35); color: var(--ink); padding: 12px; font: 15px system-ui, sans-serif; }
      label.chk { display: flex; gap: 10px; align-items: flex-start; text-align: left; font-size: 14px; color: var(--muted); margin: 12px 2px; }
      label.file { display: block; padding: 14px; border: 1px dashed var(--line); border-radius: 12px; color: var(--muted); margin-top: 10px; text-align: center; cursor: pointer; }
      label.file input { display: none; }
      #preview { max-width: 100%; border-radius: 12px; margin-top: 10px; display: none; }
      .fine { font-size: 12px; color: var(--muted); margin-top: 22px; }
      .hidden { display: none !important; }
      .err { color: var(--red); }
    </style>
  </head>
  <body>
    <main id="app">
      <div class="pulse"><i></i><i></i><i></i><b>📦</b></div>
      <div class="kicker">TAP-TO-CONFIRM</div>
      <h1>Reading tag…</h1>
    </main>
    <script>
      const app = document.getElementById("app");
      const token = decodeURIComponent(location.pathname.split("/t/")[1] || "");
      const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
      let info = null;
      let photo = null;

      const shell = (mood, icon, kicker, title, inner) => {
        document.body.className = mood;
        app.innerHTML = `<div class="pulse"><i></i><i></i><i></i><b>${icon}</b></div><div class="kicker">${kicker}</div><h1>${title}</h1>${inner}
          <p class="fine">Tapping this tag records the time and your device type. Location is only shared if you allow it. Protected by Dispute Defender.</p>`;
      };

      function home() {
        if (info.done) return thanks(info.done);
        shell("", "📦", `${esc(info.store).toUpperCase()} · PACKAGE VERIFIED`, `Hi ${esc(info.firstName)}, your order is here!`, `
          <div class="card">${info.items.map((i) => `<div class="row"><span class="tick">✓</span><span>${esc(i)}</span></div>`).join("")}</div>
          <p>Did everything arrive the way you expected?</p>
          <label class="chk"><input type="checkbox" id="loc" checked /> Share my location once, to confirm where the package was delivered</label>
          <button class="go" id="ok">✅ Everything's perfect</button>
          <button class="bad" id="bad">⚠️ Something's wrong</button>`);
        document.getElementById("ok").onclick = confirmOk;
        document.getElementById("bad").onclick = problemForm;
      }

      const where = () =>
        new Promise((resolve) => {
          if (!document.getElementById("loc")?.checked || !navigator.geolocation) return resolve(null);
          navigator.geolocation.getCurrentPosition(
            (p) => resolve({ lat: p.coords.latitude, lon: p.coords.longitude, accuracy: p.coords.accuracy }),
            () => resolve(null),
            { enableHighAccuracy: true, timeout: 7000, maximumAge: 60000 },
          );
        });

      async function send(body) {
        const res = await fetch(`/api/tap/${encodeURIComponent(token)}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || "Couldn't send. Please try again.");
        return data;
      }

      async function confirmOk(e) {
        e.target.disabled = true;
        e.target.textContent = "Confirming…";
        try {
          await send({ kind: "CONFIRM_OK", location: await where() });
          thanks("CONFIRM_OK");
        } catch (err) {
          e.target.disabled = false;
          e.target.textContent = "✅ Everything's perfect";
          alert(err.message);
        }
      }

      function problemForm() {
        shell("warn", "🛠️", "TELL THE SELLER DIRECTLY", "Sorry! What went wrong?", `
          <div class="card">
            <textarea id="note" placeholder="For example: one mug arrived chipped, or the box was empty"></textarea>
            <label class="file">📷 Add a photo (optional)<input type="file" id="file" accept="image/*" capture="environment" /></label>
            <img id="preview" alt="" />
          </div>
          <button class="go" id="send">Send to ${esc(info.store)}</button>
          <button id="back">← Back</button>
          <p>The seller gets this right away and usually fixes it within a day. You keep full PayPal Buyer Protection either way.</p>`);
        document.getElementById("file").onchange = (e) => shrink(e.target.files[0]);
        document.getElementById("back").onclick = home;
        document.getElementById("send").onclick = async (e) => {
          const note = document.getElementById("note").value.trim();
          if (!note) return document.getElementById("note").focus();
          e.target.disabled = true;
          e.target.textContent = "Sending…";
          try {
            await send({ kind: "PROBLEM", note, photo });
            thanks("PROBLEM");
          } catch (err) {
            e.target.disabled = false;
            e.target.textContent = `Send to ${info.store}`;
            alert(err.message);
          }
        };
      }

      // Phone photos are large: scale to 1600 px JPEG before upload.
      function shrink(file) {
        if (!file) return;
        const img = new Image();
        img.onload = () => {
          const k = Math.min(1, 1600 / Math.max(img.width, img.height));
          const c = document.createElement("canvas");
          c.width = Math.round(img.width * k);
          c.height = Math.round(img.height * k);
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          photo = c.toDataURL("image/jpeg", 0.82);
          const p = document.getElementById("preview");
          p.src = photo;
          p.style.display = "block";
          URL.revokeObjectURL(img.src);
        };
        img.src = URL.createObjectURL(file);
      }

      function thanks(kind) {
        if (kind === "PROBLEM")
          shell("warn", "📨", "SENT TO THE SELLER", "Thanks, they're on it.", `<p>${esc(info.store)} has your note${photo ? " and photo" : ""}. They'll reply by email, usually within a day.</p>`);
        else shell("ok", "✅", "DELIVERY CONFIRMED", "Enjoy your order!", `<p>Thanks for confirming, ${esc(info.firstName)}. ${esc(info.store)} has been told it arrived safely.</p>`);
      }

      fetch(`/api/tap/${encodeURIComponent(token)}`)
        .then(async (r) => {
          const data = await r.json().catch(() => ({}));
          if (!r.ok) throw new Error(data.error || "This tag isn't recognized.");
          info = data;
          home();
        })
        .catch((err) => shell("warn", "❔", "TAG NOT RECOGNIZED", "Hmm, we couldn't read this tag.", `<p class="err">${esc(err.message)}</p><p>Contact the seller with your order number.</p>`));
    </script>
  </body>
</html>
