# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: dispute-defender
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Leave these empty for demo mode, or fill them in the Render dashboard.
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optional integrations (see docs/INTEGRATIONS.md)
      - key: SHIPPO_API_KEY
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: OUTBOUND_WEBHOOK_URL
        sync: false
      - key: OUTBOUND_WEBHOOK_SECRET
        sync: false
      # Signs NFC tag links. Set it once so tags you've written keep working after redeploys.
      - key: NFC_TAG_SECRET
        generateValue: true
