# Publishes the in-browser demo (mobile/www: the app plus its offline demo engine) to GitHub Pages.
# No server, no keys: sample disputes, the scripted agent, Autopilot and simulated PayPal rulings.
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Refresh the engine from src/ so the demo always matches the server's demo mode.
      - run: node mobile/scripts/copy-engine.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/www
      - id: deployment
        uses: actions/deploy-pages@v4
